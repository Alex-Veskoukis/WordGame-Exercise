version: '3.8'


services:
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: word-game-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - appsmith_data:/appsmith-stacks
    environment:
      - APPSMITH_ENCRYPTION_PASSWORD=${APPSMITH_ENCRYPTION_PASSWORD:-change_this_secure_password_123}
      - APPSMITH_ENCRYPTION_SALT=${APPSMITH_ENCRYPTION_SALT:-change_this_secure_salt_456}
      - APPSMITH_MONGODB_URI=mongodb://mongo:27017/appsmith
    depends_on:
      - postgres
      - game-backend
      - mongo
    networks:
      - word-game-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: word-game-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamepass123}
      POSTGRES_DB: ${POSTGRES_DB:-wordgame}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/export.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
    networks:
      - word-game-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d wordgame"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: word-game-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - postgres
    networks:
      - word-game-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'OK';"]
      interval: 30s
      timeout: 5s
      retries: 3

  game-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: word-game-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gameuser}:${POSTGRES_PASSWORD:-gamepass123}@postgres:5432/${POSTGRES_DB:-wordgame}
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - AI_HINTS_ENABLED=${AI_HINTS_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo-0125}
      - OPENAI_CHAT_URL=${OPENAI_CHAT_URL:-https://api.openai.com/v1/chat/completions}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-4}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-60}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
    volumes:
      - ./backend/nouns.json:/app/nouns.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - word-game-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mock-api-2:
    build:
      context: ./mock-api-2
      dockerfile: Dockerfile
    container_name: mock-hints
    restart: unless-stopped
    ports:
      - "3001:3001"
    networks:
      - word-game-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/hints"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:6
    container_name: word-game-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks:
      - word-game-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo-init:
    image: mongo:6
    container_name: word-game-mongo-init
    restart: "no"
    depends_on:
      - mongo
    networks:
      - word-game-network
    command: >
      bash -c "
        sleep 10 &&
        mongosh --host mongo:27017 --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo:27017\" }]
          })
        '
      "

volumes:
  postgres_data:
    driver: local
    name: word-game-postgres-data
  appsmith_data:
    driver: local
    name: word-game-appsmith-data
  mongo_data:
    driver: local
    name: word-game-mongo-data

networks:
  word-game-network:
    driver: bridge
    name: word-game-network
